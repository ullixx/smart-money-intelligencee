name: Deploy Cloudflare Worker
# Trigger deployment after repository secrets were configured

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run swap decoder tests
        run: node --test tests/swap-decoder.test.mjs

      - name: Run C-F intelligence tests
        run: node --test tests/intelligence-engine.test.mjs

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.163.0"
          command: deploy --config wrangler.toml
